<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaConnect Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #e1306c; }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #e1306c;
      color: white;
      font-weight: bold;
    }
    .profile-card {
      background: #222;
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
      display: none;
    }
    .profile-card h2 { margin: 0 0 10px 0; color: #e1306c; }
    .profile-card p { margin: 5px 0; color: #ccc; }
  </style>
</head>
<body>
  <h1>InstaConnect</h1>
  <p>Your Instagram tools inside Telegram</p>

  <div class="card">
    <h3>Look up a profile</h3>
    <input id="username" placeholder="Enter Instagram username" />
    <button onclick="lookup()">View Profile</button>
    
    <div id="profile" class="profile-card">
      <h2 id="profileName"></h2>
      <p id="profileInfo"></p>
      <p style="font-size:14px; color:#888;">Public info only • Full features stay in the official Instagram app</p>
    </div>
  </div>

  <div class="card">
    <h3>Quick actions</h3>
    <button onclick="clearProfile()">Clear</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function lookup() {
      const raw = document.getElementById('username').value.trim();
      const user = raw.replace('@', '');
      if (!user) return;

      document.getElementById('profileName').textContent = '@' + user;
      document.getElementById('profileInfo').textContent = 'Profile loaded inside Mini App';
      document.getElementById('profile').style.display = 'block';
    }

    function clearProfile() {
      document.getElementById('profile').style.display = 'none';
      document.getElementById('username').value = '';
    }
  </script>
</body>
</html>
